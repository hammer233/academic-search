name: Build Windows Installer

# 什么时候跑：
#   1) 手动触发（Actions 页面点 "Run workflow"）
#   2) 本文件被修改并提交时自动跑一次
# 在 GitHub 上，这个文件必须放在：.github/workflows/build-windows.yml
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build-windows.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build CSSwitch (Windows x64)
    # GitHub 托管的 Windows runner，自带 MSVC + Windows SDK + WebView2
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Setup Rust toolchain (MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri

      - name: Install frontend deps
        working-directory: desktop
        run: npm install

      # build.rs 会自动把 gateway sidecar 编译并 staging 到
      # desktop/src-tauri/binaries/csswitch-gateway-x86_64-pc-windows-msvc.exe，
      # 因此这里只需一条 tauri build 即可产出完整安装包。
      - name: Build Tauri bundle (NSIS + MSI)
        working-directory: desktop
        run: npm run tauri build

      - name: List build output
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $root = "desktop/src-tauri/target/release/bundle"
          if (-not (Test-Path $root)) { throw "bundle directory not found: $root" }
          Get-ChildItem -Recurse -File $root | ForEach-Object {
            "{0,10:N2} MB  {1}" -f ($_.Length / 1MB), $_.FullName
          }

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: CSSwitch-windows-x64
          path: |
            desktop/src-tauri/target/release/bundle/nsis/*.exe
            desktop/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 30
